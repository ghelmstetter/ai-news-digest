name: Build episode

on:
  push:
    branches: [main]
    paths: ["scripts/**", "tools/**", "redo.txt", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      redo_date:
        description: "Regenerate this date's episode (YYYY-MM-DD), optional"
        required: false

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch published site (gh-pages)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth=1 origin gh-pages
            git worktree add site origin/gh-pages
          else
            mkdir -p site
          fi

      - name: Install ffmpeg and speech checker
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper

      - name: Cache speech-check model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en

      - name: Generate audio and feed
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REDO_DATE: ${{ github.event.inputs.redo_date }}
        run: python3 tools/build.py

      - name: Publish to gh-pages (fresh single commit, keeps the repo small)
        run: |
          cd site
          rm -rf .git
          git init -q -b gh-pages
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
